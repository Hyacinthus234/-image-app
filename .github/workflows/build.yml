name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发构建

# 允许 GITHUB_TOKEN 写入仓库（创建 Release 和 tag）
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
      
      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
      
      # 更新 latest tag 指向当前提交
      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
      
      # 自动创建/更新 Release 并上传 APK
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AI 图片生成器（最新版）"
          body: |
            ## 🤖 自动构建的 APK
            
            - 提交：`${{ github.sha }}`
            - 构建时间：`${{ github.event.repository.updated_at }}`
            
            ### 下载说明
            - **app-debug.apk**：调试版，可直接安装到手机
            - app-release-unsigned.apk：未签名版（需自行签名，一般用不到）
            
            > 提示：手机安装时如提示"未知来源"，请允许安装。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
